<div class="min-vh-100 d-flex flex-column bg-light">
<header class="navbar navbar-light bg-white border-bottom px-4 py-2"><span class="fw-bold fs-4 text-primary">PayCore</span></header>
<div class="flex-grow-1 d-flex justify-content-center align-items-center p-3">
<div class="card p-4 shadow-sm" style="max-width:420px;width:100%">
<h3 class="fw-bold text-primary">Create Account</h3><p class="text-muted small">Create an employee account for the PayCore demo.</p>
<div *ngIf="errorMessage" class="alert alert-danger small">{{errorMessage}}</div><div *ngIf="successMessage" class="alert alert-success small">{{successMessage}}</div>
<form [formGroup]="form" (ngSubmit)="submit()">
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" formControlName="email" placeholder="you@example.com"><div class="text-danger small" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Enter a valid email.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" formControlName="password" placeholder="Minimum 8 characters"></div>
<div class="mb-4"><label class="form-label">Confirm Password</label><input class="form-control" type="password" formControlName="confirmPassword"></div>
<button class="btn btn-primary w-100" type="submit" [disabled]="loading"><span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>Create Account</button>
</form><div class="text-center mt-3"><a routerLink="/login">Already have an account? Sign in</a></div>
</div></div></div>
