<div class="min-vh-100 d-flex flex-column bg-light">
<header class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-2"><div class="container-fluid p-0"><span class="fw-bold fs-4 text-primary">PayCore</span><span class="ms-2 badge bg-light text-dark border small">HCM</span></div></header>
<div class="flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5 px-3"><div class="card p-4 shadow-sm" style="max-width:420px;width:100%">
<div class="text-center mb-4"><h3 class="fw-bold text-primary mb-1">PayCore</h3><p class="text-muted small">Payroll & HR Management Portal</p></div>
<div *ngIf="errorMessage" class="alert alert-danger p-2 small mb-3">{{errorMessage}}</div>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
<div class="mb-3"><label class="form-label">Email Address</label><input type="email" formControlName="email" class="form-control" placeholder="admin@paycore.com"><div class="text-danger small" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">Enter a valid email.</div></div>
<div class="mb-4"><label class="form-label">Password</label><input type="password" formControlName="password" class="form-control" placeholder="••••••••"></div>
<button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading"><span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>Sign In</button>
</form>
<div class="mt-4 pt-3 border-top text-center"><p class="text-muted small mb-2">Quick Demo</p><div class="d-flex justify-content-center gap-2"><button class="btn btn-outline-secondary btn-sm" type="button" (click)="fillDemo('admin@paycore.com')">Admin</button><button class="btn btn-outline-secondary btn-sm" type="button" (click)="fillDemo('employee@paycore.com')">Employee</button></div><div class="mt-3"><a routerLink="/register">Create a new account</a></div></div>
</div></div></div>
